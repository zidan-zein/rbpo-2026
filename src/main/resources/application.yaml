spring:
  application:
    name: "1БКС24001"
  datasource:
    url: ${PG_URL}
    # логин и пароль берутся из переменных окружения, в коде их нет
    username: ${PG_SERVICE_USER}
    password: ${PG_SERVICE_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  # чтобы в ответе с ошибкой было видно причину
  web:
    error:
      include-message: always

server:
  address: 127.0.0.1
  port: ${MUSEUM_PORT:8085}
  error:
    include-stacktrace: never
    include-exception: false
