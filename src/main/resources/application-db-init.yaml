# запускать один раз с профилем db-init, создает таблицы и тестовые данные
# скрипты выполняет владелец схемы, а не сервисный пользователь
spring:
  sql:
    init:
      mode: always
      username: ${PG_OWNER_USER}
      password: ${PG_OWNER_PASS}
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
